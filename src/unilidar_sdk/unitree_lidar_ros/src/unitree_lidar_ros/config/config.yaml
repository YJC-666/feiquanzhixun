####################################################
# Unitree L1 lidar configuration for dog_ws ROS1 bringup
####################################################

initialize_type: 1

port: "/dev/ttyS6"

lidar_port: 6101
lidar_ip: "10.10.10.10"
local_port: 6201
local_ip: "10.10.10.100"

rotate_yaw_bias: 0
range_scale: 0.001
range_bias: 0
range_max: 50
range_min: 0.0

cloud_frame: "unilidar_lidar"
cloud_topic: "unilidar/cloud"
cloud_scan_num: 18

imu_frame: "unilidar_imu"
imu_topic: "unilidar/imu"