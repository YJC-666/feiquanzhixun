# === 通用 topics ===
topics:
  start: /start_point
  goal: /goal_point
  goal_pose: /goal_pose
  odom: /pointlio/odom
  map_cloud: /navigation_map_cloud
  global_map_cloud: /navigation_map_cloud
  local_map_cloud: /local_navigation_map_cloud
  start_navigation: /start_navigation
  stop_navigation: /stop_navigation
  goal_tolerance: /navigation/goal_tolerance
  control_mode: /navigation/control_mode
  manual_cmd: /web_cmd_vel
  nav_cmd: /cmd_vel
  status: /web_selection_status

frame_id: camera_init

grid:
  resolution: 0.20

# === 全局规划器 ===
planner:
  robot_radius: 0.48
  obstacle_inflation_radius: 0.55
  obstacle_vertical_min_height: 0.18
  obstacle_min_height_above_base: 0.10
  obstacle_max_height_above_base: 1.60
  replan_on_map_update: true
  use_odom_start_for_replan: true
  search_padding_cells: 40
  snap_radius_cells: 8
  max_iterations: 220000
  max_path_points: 5000

# global_planner 话题: 只规划全局路径
topics_path: /global_plan

# === 局部规划器 ===
local_planner:
  resolution: 0.20
  box_half_size: 1.5         # 3×3×3m 盒子的半边长
  robot_radius: 0.48
  obstacle_inflation_radius: 0.55
  obstacle_vertical_min_height: 0.18
  obstacle_min_height_above_base: 0.10
  obstacle_max_height_above_base: 1.60
  pointcloud_min_distance: 0.15  # 机器人周围排除点云的距离 (m)，避免自身干扰
  max_iterations: 8000
  replan_rate: 5.0           # 局部重规划频率 (Hz)
  snap_radius_cells: 6
  local_plan_lookahead: 3.0  # 局部路径前视距离 (m)

# global_plan 输入, local_plan 输出
topics_global_path: /global_plan
topics_local_plan: /local_plan

# === Pure Pursuit 控制参数 (局部规划器内) ===
control:
  require_start_command: false
  rate: 20.0
  lookahead_distance: 0.55
  tracking_point_tolerance: 0.22
  goal_tolerance: 0.08
  goal_yaw_tolerance: 0.24
  linear_gain: 0.75
  lateral_gain: 0.65
  heading_gain: 1.15
  final_yaw_gain: 0.65
  enable_lateral_motion: false
  max_linear_x: 0.30
  max_linear_y: 0.0
  max_angular_z: 0.65
  manual_abort_threshold: 0.03